name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Requerido para que Claude lea los resultados de CI en PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

         # Esta es una configuración opcional que permite a Claude leer los resultados de CI en las solicitudes de extracción.

          additional_permissions: |

          actions: read

          # Opcional: Proporciona un mensaje personalizado a Claude. Si no se especifica, Claude ejecutará las instrucciones indicadas en el comentario que la etiquetó.
          
          # prompt: 'Actualiza la descripción de la solicitud de extracción para incluir un resumen de los cambios.'
          
          # Opcional: Agrega claude_args para personalizar el comportamiento y la configuración.
          # Consulta https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          
          # o https://code.claude.com/docs/en/cli-reference para ver las opciones disponibles.
          # claude_args: '--allowed-tools Bash(gh pr:*)'
